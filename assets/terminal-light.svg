<svg xmlns="http://www.w3.org/2000/svg" width="900" height="393" viewBox="0 0 900 393" role="img" aria-labelledby="t d">
<title id="t">CyyberChat</title>
<desc id="d">Aspiring cybersecurity engineer from France. Training for SOC / CSIRT, reverse engineering, Proxmox homelab, building a spaced-repetition app to learn cyber.</desc>
<defs><clipPath id="c0"><rect x="54" y="56" height="27" width="0"><animate attributeName="width" begin="0.60s" dur="0.42s" values="0.0;9.9;19.8;29.7;39.6;49.5;59.4" calcMode="discrete" fill="freeze"/></rect></clipPath><clipPath id="c3"><rect x="54" y="137" height="27" width="0"><animate attributeName="width" begin="2.10s" dur="0.77s" values="0.0;9.9;19.8;29.7;39.6;49.5;59.4;69.3;79.2;89.1;99.0;108.9" calcMode="discrete" fill="freeze"/></rect></clipPath><clipPath id="c9"><rect x="54" y="299" height="27" width="0"><animate attributeName="width" begin="4.49s" dur="0.70s" values="0.0;9.9;19.8;29.7;39.6;49.5;59.4;69.3;79.2;89.1;99.0" calcMode="discrete" fill="freeze"/></rect></clipPath><clipPath id="win"><rect x="1" y="1" width="898" height="391" rx="12"/></clipPath></defs>
<g clip-path="url(#win)">
<rect width="900" height="393" fill="#ffffff"/>
<rect width="900" height="40" fill="#f6f8fa"/>
<rect y="40" width="900" height="1" fill="#d0d7de"/>
