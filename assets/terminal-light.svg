<rect x="1" y="1" width="898" height="391" rx="12" fill="none" stroke="#d0d7de"/>
<circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
<g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16">
<text x="450.0" y="25" text-anchor="middle" font-size="13" fill="#656d76">cyyberchat@homelab: ~</text>
<g opacity="0"><set attributeName="opacity" to="1" begin="0.30s" fill="freeze"/><text x="32" y="74" fill="#bf3989">❯</text><text x="54" y="74" clip-path="url(#c0)" fill="#1f2328">whoami</text></g>
<text x="32" y="101" fill="#656d76" opacity="0"><tspan fill="#8250df" font-weight="700">CyyberChat</tspan> · aspiring cybersecurity engineer · France<set attributeName="opacity" to="1" begin="1.47s" fill="freeze"/></text>
<g opacity="0"><set attributeName="opacity" to="1" begin="1.80s" fill="freeze"/><text x="32" y="155" fill="#bf3989">❯</text><text x="54" y="155" clip-path="url(#c3)" fill="#1f2328">cat now.txt</text></g>
<text x="32" y="182" fill="#656d76" opacity="0">→ training for <tspan fill="#8250df" font-weight="700">SOC / CSIRT</tspan>: logs, triage, DFIR<set attributeName="opacity" to="1" begin="3.32s" fill="freeze"/></text>
<text x="32" y="209" fill="#656d76" opacity="0">→ <tspan fill="#8250df" font-weight="700">reverse engineering</tspan>, late at night<set attributeName="opacity" to="1" begin="3.50s" fill="freeze"/></text>
<text x="32" y="236" fill="#656d76" opacity="0">→ running a <tspan fill="#8250df" font-weight="700">Proxmox homelab</tspan> (LXC, Docker)<set attributeName="opacity" to="1" begin="3.68s" fill="freeze"/></text>
<text x="32" y="263" fill="#656d76" opacity="0">→ building a <tspan fill="#8250df" font-weight="700">spaced-repetition app</tspan> to learn cyber<set attributeName="opacity" to="1" begin="3.86s" fill="freeze"/></text>
<g opacity="0"><set attributeName="opacity" to="1" begin="4.19s" fill="freeze"/><text x="32" y="317" fill="#bf3989">❯</text><text x="54" y="317" clip-path="url(#c9)" fill="#1f2328">ls ~/tools</text></g>
<text x="32" y="344" fill="#656d76" opacity="0">ghidra · ida · gdb · python · burp · wireshark · linux · docker · proxmox · typescript<set attributeName="opacity" to="1" begin="5.64s" fill="freeze"/></text>
<g opacity="0"><set attributeName="opacity" to="1" begin="6.27s" fill="freeze"/><text x="32" y="371" fill="#bf3989">❯</text><rect x="54" y="357" width="9" height="18" fill="#8250df"><animate attributeName="opacity" values="1;0" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/></rect></g>
